name: Home Assistant Ruff checks (uv v5)
description: Run the shared Ruff lint and format checks with astral-sh/setup-uv v5.
inputs:
  path:
    description: Workspace-relative path for Ruff
    default: '.'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.4.0
    - run: |
        uvx ruff check -- "$RUFF_PATH"
        uvx ruff format --check -- "$RUFF_PATH"
      shell: bash
      env:
        RUFF_PATH: ${{ inputs.path }}
