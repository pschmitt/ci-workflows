name: Python Ruff checks
description: Set up Python, install Ruff, and run Ruff checks
inputs:
  python-version:
    description: Python version used for the Ruff checks
    required: false
    default: '3.x'
  github-output:
    description: Emit Ruff output in GitHub Actions annotation format
    required: false
    default: 'false'
  format-check:
    description: Also check formatting with `ruff format --check`
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Ruff
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff
      if: inputs.github-output != 'true'
      shell: bash
      run: ruff check

    - name: Run Ruff with GitHub annotations
      if: inputs.github-output == 'true'
      shell: bash
      run: ruff check --output-format=github .

    - name: Check Ruff formatting
      if: inputs.format-check == 'true'
      shell: bash
      run: ruff format --check .
