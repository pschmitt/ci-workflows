name: Python lint
description: Run Flake8 and Black checks with the selected Python version
inputs:
  python-version:
    description: Python version used for the lint checks
    required: true
  flake8-mode:
    description: Flake8 implementation (`default` keeps py-actions/flake8@v2)
    required: false
    default: default
  requirements-file:
    description: Optional pip requirements file to install before linting
    required: false
    default: ''
  flake8-args:
    description: Arguments for the required Flake8 check
    required: false
    default: '.'
  flake8-warning-args:
    description: Optional arguments for a second advisory Flake8 check
    required: false
    default: ''
  black-args:
    description: Arguments for Black
    required: false
    default: '--check --diff .'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate Flake8 mode
      if: inputs.flake8-mode != 'default' && inputs.flake8-mode != 'custom'
      shell: bash
      run: |
        echo 'flake8-mode must be either default or custom' >&2
        exit 1

    - name: Flake8
      if: inputs.flake8-mode == 'default'
      uses: py-actions/flake8@v2

    - name: Install custom Flake8 dependencies
      if: inputs.flake8-mode == 'custom'
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        if [[ -n "$REQUIREMENTS_FILE" && -f "$REQUIREMENTS_FILE" ]]; then
          pip install -r "$REQUIREMENTS_FILE"
        fi

    - name: Run required Flake8 check
      if: inputs.flake8-mode == 'custom'
      shell: bash
      env:
        FLAKE8_ARGS: ${{ inputs.flake8-args }}
      run: |
        read -r -a flake8_args <<< "$FLAKE8_ARGS"
        flake8 "${flake8_args[@]}"

    - name: Run advisory Flake8 check
      if: inputs.flake8-mode == 'custom' && inputs.flake8-warning-args != ''
      shell: bash
      env:
        FLAKE8_ARGS: ${{ inputs.flake8-warning-args }}
      run: |
        read -r -a flake8_args <<< "$FLAKE8_ARGS"
        flake8 "${flake8_args[@]}"

    - name: Black
      if: inputs.flake8-mode == 'default'
      shell: bash
      env:
        BLACK_ARGS: ${{ inputs.black-args }}
      run: |
        python -m pip install --upgrade pip
        pip install black
        read -r -a black_args <<< "$BLACK_ARGS"
        black "${black_args[@]}"

    - name: Black (custom Flake8 mode)
      if: inputs.flake8-mode == 'custom'
      shell: bash
      env:
        BLACK_ARGS: ${{ inputs.black-args }}
      run: |
        read -r -a black_args <<< "$BLACK_ARGS"
        black "${black_args[@]}"
