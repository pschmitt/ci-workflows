name: Python lint
description: Run Flake8 and Black checks with the selected Python version
inputs:
  python-version:
    description: Python version used for the lint checks
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: flake8
      uses: py-actions/flake8@v2

    - name: Black
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install black
        black --check --diff .
