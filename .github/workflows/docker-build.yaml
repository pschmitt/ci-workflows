# Build and publish a repository's multi-platform debug image to Docker Hub and
# GHCR. The caller owns its triggers and passes the image name and platforms.
name: Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name without a registry prefix, for example pschmitt/debug
        type: string
        required: true
      platforms:
        description: Comma-separated Buildx platforms
        type: string
        required: true
      publish:
        description: Log in to registries, publish images, and export the BuildKit cache
        type: boolean
        default: true
    secrets:
      dockerhub_username:
        required: false
      dockerhub_password:
        required: false

# The calling job grants contents: read and packages: write for publishing.
# Non-publishing callers can restrict their token to read-only permissions.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@master
        with:
          ref: ${{ github.ref }}

      - name: Validate Docker Hub credentials
        if: inputs.publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
          DOCKERHUB_PASSWORD: ${{ secrets.dockerhub_password }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_PASSWORD" ]]; then
            echo "Docker Hub credentials are required when publish is true." >&2
            exit 1
          fi

      - name: Docker login
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password }}

      - name: Log in to the Container registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          use: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          tags: |
            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.publish && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: ${{ inputs.publish && 'type=gha,mode=max' || '' }}
