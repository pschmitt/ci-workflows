name: Validate Home Assistant integration

on:
  workflow_call:
    inputs:
      lint-path:
        description: Workspace-relative path for Ruff
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  hassfest:
    uses: ./.github/workflows/home-assistant-hassfest.yaml

  ruff:
    uses: ./.github/workflows/home-assistant-ruff.yaml
    with:
      lint-path: ${{ inputs.lint-path }}
