# statix, deadnix and nixfmt over every tracked Nix file. The linters come from
# the caller's locked nixpkgs when it has a flake, so each repository updates
# them on its own schedule; without a flake they come from the Nix registry.
name: nix-lint
on:
  workflow_call:
permissions:
  contents: read
jobs:
  statix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Install statix
        run: |
          inputs=()
          if [[ -f flake.nix ]]
          then
            inputs=(--inputs-from .)
          fi

          nix shell "${inputs[@]}" nixpkgs#statix \
            --command printenv PATH >> "$GITHUB_PATH"
      - run: statix check

  deadnix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Install deadnix
        run: |
          inputs=()
          if [[ -f flake.nix ]]
          then
            inputs=(--inputs-from .)
          fi

          nix shell "${inputs[@]}" nixpkgs#deadnix \
            --command printenv PATH >> "$GITHUB_PATH"
      - name: deadnix
        run: git ls-files -z '*.nix' | xargs -0 -r deadnix --fail

  nixfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Install nixfmt
        run: |
          inputs=()
          if [[ -f flake.nix ]]
          then
            inputs=(--inputs-from .)
          fi

          nix shell "${inputs[@]}" nixpkgs#nixfmt \
            --command printenv PATH >> "$GITHUB_PATH"
      - run: git ls-files -z '*.nix' | xargs -0 -r nixfmt --check
