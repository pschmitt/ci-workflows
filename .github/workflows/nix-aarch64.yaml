name: nix-aarch64
# A flake's aarch64-linux packages and checks, built natively on GitHub's arm
# runners (nixbot on x86_64 could only emulate them) and pushed to the niks3 S3
# cache with a short-lived GitHub OIDC token: main pins its outputs, pull
# requests push unpinned (niks3's GC collects them). The server must trust the
# calling repository (oidc.providers.github in its config), and the caller needs
# `permissions: id-token: write` and the repository variable NIKS3_SERVER_URL.
# The same S3 bucket is read as a substituter (read-only key, passed as secrets)
# and a Nix store cache keyed on flake.lock is kept for main. No concurrency group
# of its own: it runs as a job of the caller's workflow, whose group a second one
# with the same name would deadlock; the caller decides what to cancel.
on:
  workflow_call:
    inputs:
      exclude:
        description: JSON list of package names to leave out (those that cannot build on aarch64-linux)
        type: string
        default: "[]"
      exclude-checks:
        description: >-
          JSON list of aarch64-linux flake checks to leave out, e.g. NixOS VM tests
          (GitHub's arm runners have no KVM). The remaining checks are built one by
          one; `nix flake check` is not used, since it would evaluate excluded
          packages and checks too.
        type: string
        default: "[]"
      pin-prefix:
        description: Prefix of the pins main creates (the server's rule for this repository allows it), e.g. gh-rbw-main
        type: string
        required: true
      s3-public-key:
        description: >-
          Public key the niks3 server signs its paths with. Without it Nix ignores
          every substitute from the S3 store that only niks3 signed ("not signed by
          any of the keys in 'trusted-public-keys'") and builds it again.
        type: string
        default: "niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g="
    secrets:
      s3_store:
        description: The niks3 S3 store URL, added as a substituter (with the read-only key below)
        required: false
      s3_access_key:
        description: Read-only access key of the S3 store
        required: false
      s3_secret_key:
        description: Read-only secret key of the S3 store
        required: false
permissions:
  contents: read
  id-token: write
env:
  NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
  # The niks3 client of the server's release.
  NIKS3_CLI: github:Mic92/niks3/a79dc58832332ebd953974e71160ab69e2371d62#niks3
jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pschmitt/ci-workflows
          path: .ci-workflows
      - name: Configure the S3 cache
        id: s3
        env:
          S3_STORE: ${{ secrets.s3_store }}
          S3_ACCESS_KEY: ${{ secrets.s3_access_key }}
          S3_SECRET_KEY: ${{ secrets.s3_secret_key }}
          S3_PUBLIC_KEY: ${{ inputs.s3-public-key }}
        run: |
          if [[ -z "$S3_STORE" || -z "$S3_ACCESS_KEY" || -z "$S3_SECRET_KEY" ]]
          then
            echo "conf=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The nix-daemon (root) substitutes, the client checks the cache.
          credentials="$(printf '[niks3]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$S3_ACCESS_KEY" "$S3_SECRET_KEY")"
          for home in "$HOME" /root
          do
            sudo install -d -m 700 "$home/.aws"
            sudo tee "$home/.aws/credentials" > /dev/null <<< "$credentials"
            sudo chmod 600 "$home/.aws/credentials"
          done
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.aws"
          {
            echo "conf<<EOF"
            echo "extra-substituters = $S3_STORE"
            echo "extra-trusted-public-keys = $S3_PUBLIC_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # Upstream Nix, not Determinate Nix: with this job's OIDC token
      # determinate-nixd logs in to FlakeHub and keeps a root-only
      # /nix/var/determinate/auth_state.json, which made every
      # cache-nix-action save fail (tar: Permission denied).
      # No store optimisation: its hard links into /nix/store/.links end up in
      # the saved cache, and restoring it then fails ("Cannot hard link to
      # .links/..."), leaving a store whose database lists missing paths.
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            fallback = true # build from source if a binary substitute fails
            auto-optimise-store = false
            ${{ steps.s3.outputs.conf }}
      # Public settings only; shows what the daemon will trust when substituting.
      - name: Show Nix trust settings
        run: |
          nix --version
          nix config show trusted-public-keys
          nix config show require-sigs
          sudo cat /etc/nix/nix.conf /etc/nix/nix.custom.conf 2>/dev/null | grep -E 'trusted-public-keys|include' || true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
      - name: Build the packages
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          mkdir -p "$RUNNER_TEMP/outs"
          nix eval --json .#packages.aarch64-linux --apply builtins.attrNames \
            | jq -r --argjson exclude "$EXCLUDE" '.[] | select(. as $name | $exclude | index($name) | not)' \
            | while read -r attr
          do
            nix build --no-link --print-build-logs --print-out-paths ".#packages.aarch64-linux.$attr" \
              > "$RUNNER_TEMP/outs/$attr"
            # A crane package's dependency build and vendored sources are only
            # build inputs, so pushing the package leaves them out of the cache
            # and every source change rebuilds all dependencies. Push them too.
            for input in cargoArtifacts cargoVendorDir
            do
              if [[ "$(nix eval --json ".#packages.aarch64-linux.$attr" \
                --apply "p: p ? $input && builtins.isAttrs p.$input && p.$input ? outPath")" == true ]]
              then
                nix build --no-link --print-out-paths ".#packages.aarch64-linux.$attr.$input" \
                  > "$RUNNER_TEMP/outs/$attr-$input"
              fi
            done
          done
      - name: Flake checks
        env:
          EXCLUDE_CHECKS: ${{ inputs.exclude-checks }}
        # Not `nix flake check`: upstream Nix evaluates every package and check
        # of this system there, so an `exclude`d package (one that cannot even
        # evaluate on aarch64-linux) or an `exclude-checks` entry fails it. The
        # packages are built above; build the remaining checks one by one.
        run: |
          nix eval --json .#checks.aarch64-linux --apply builtins.attrNames \
            | jq -r --argjson exclude "$EXCLUDE_CHECKS" '.[] | select(. as $name | $exclude | index($name) | not)' \
            | while read -r attr
          do
            nix build --no-link --print-build-logs ".#checks.aarch64-linux.$attr"
          done
      - name: Push to niks3
        # Not for forks (no OIDC token) or branches other than main and pull requests.
        if: ${{ env.NIKS3_SERVER_URL != '' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
        env:
          PIN_PREFIX: ${{ inputs.pin-prefix }}
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]
          then
            echo "No GitHub OIDC token available; not pushing." >&2
            exit 0
          fi
          cli="$(nix build --no-link --print-out-paths "$NIKS3_CLI")"
          auth=(--server-url "$NIKS3_SERVER_URL" --auth-token-script "python3 $GITHUB_WORKSPACE/.ci-workflows/scripts/niks3-oidc-token.py")
          for file in "$RUNNER_TEMP"/outs/*
          do
            attr="$(basename "$file")"
            index=0
            while read -r path
            do
              if [[ "$GITHUB_REF" == refs/heads/main ]]
              then
                "$cli/bin/niks3" push "${auth[@]}" --pin "$PIN_PREFIX-$attr-$index" "$path"
              else
                "$cli/bin/niks3" push "${auth[@]}" "$path"
              fi
              index=$((index + 1))
            done < "$file"
          done
