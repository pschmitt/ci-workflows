name: nix-aarch64
# A flake's aarch64-linux packages and checks, built natively on GitHub's arm
# runners (nixbot on x86_64 could only emulate them) and pushed to the niks3 S3
# cache with a short-lived GitHub OIDC token: main pins its outputs, pull
# requests push unpinned (niks3's GC collects them). The server must trust the
# calling repository (oidc.providers.github in its config), and the caller needs
# `permissions: id-token: write` and the repository variable NIKS3_SERVER_URL.
# The same S3 bucket is read as a substituter (read-only key, passed as secrets)
# and a Nix store cache keyed on flake.lock is kept for main. No concurrency group
# of its own: it runs as a job of the caller's workflow, whose group a second one
# with the same name would deadlock; the caller decides what to cancel.
on:
  workflow_call:
    inputs:
      exclude:
        description: JSON list of package names to leave out (those that cannot build on aarch64-linux)
        type: string
        default: "[]"
      exclude-checks:
        description: >-
          JSON list of aarch64-linux flake checks to leave out, e.g. NixOS VM tests
          (GitHub's arm runners have no KVM). The remaining checks are built one by
          one; `nix flake check` is not used, since it would evaluate excluded
          packages and checks too.
        type: string
        default: "[]"
      pin-prefix:
        description: Prefix of the pins main creates (the server's rule for this repository allows it), e.g. gh-rbw-main
        type: string
        required: true
      image-package:
        description: Optional aarch64 package archive to export as a workflow artifact after its package build
        type: string
        default: ""
      image-artifact:
        description: Artifact name for the optional image package archive
        type: string
        default: ""
      image-archive-file:
        description: Filename for the optional image package archive artifact
        type: string
        default: image.tar.gz
      s3-public-keys:
        description: >-
          Space-separated public keys that sign the paths in the S3 store. niks3 keeps
          the uploader's signature (a build host's key, or its own for paths it signs),
          so these are the keys the hosts trust for that cache. Without them Nix
          ignores those substitutes ("not signed by any of the keys in
          'trusted-public-keys'") and builds them again.
        type: string
        default: >-
          niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          rofl-10:vYRBSypcO/0NnPsDxgSELIcJotU/LmZ1f6vZUKUmty0=
          rofl-13:ESRCqy2jcftg690k98KSNqF6LgOqz1X7ZnXXE//WWD0=
          rofl-14:XkEHSleW71wOnEnAcTZnYi/badnlAJAUxt6SIzbYsG8=
          rofl-15:x68gyyrKadDfvJKdpPkRvmPckrYF6XqzlKaqs2xheVw=
          rofl-16:DB8WQ415B8v3P9r1R8U4pO1iKrOAldbBHbSz+chryXI=
          gh-actions:x+pfxw4yRpZbonnjaCR0nIm5eN1wOGAki0soDQyFjJQ=
    secrets:
      s3_store:
        description: The niks3 S3 store URL, added as a substituter (with the read-only key below)
        required: false
      s3_access_key:
        description: Read-only access key of the S3 store
        required: false
      s3_secret_key:
        description: Read-only secret key of the S3 store
        required: false
permissions:
  contents: read
  id-token: write
env:
  NIKS3_SERVER_URL: ${{ vars.NIKS3_SERVER_URL }}
  # The niks3 client of the server's release.
  NIKS3_CLI: github:Mic92/niks3/a79dc58832332ebd953974e71160ab69e2371d62#niks3
jobs:
  build:
    name: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pschmitt/ci-workflows
          path: .ci-workflows
      - uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.s3_store }}
          s3-access-key: ${{ secrets.s3_access_key }}
          s3-secret-key: ${{ secrets.s3_secret_key }}
          s3-public-keys: ${{ inputs.s3-public-keys }}
          extra-conf: |
            fallback = true
            auto-optimise-store = false
      # Public settings only; shows what the daemon will trust when substituting.
      - name: Show Nix trust settings
        run: |
          nix --version
          nix config show trusted-public-keys
          nix config show require-sigs
          sudo cat /etc/nix/nix.conf /etc/nix/nix.custom.conf 2>/dev/null | grep -E 'trusted-public-keys|include' || true
      # The dependent checks job saves the cache after both jobs have built.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: false
          gc-max-store-size-linux: 4G
      - name: Build the packages
        env:
          EXCLUDE: ${{ inputs.exclude }}
          IMAGE_PACKAGE: ${{ inputs.image-package }}
          IMAGE_ARTIFACT: ${{ inputs.image-artifact }}
          IMAGE_ARCHIVE_FILE: ${{ inputs.image-archive-file }}
        run: |
          mkdir -p "$RUNNER_TEMP/outs"
          if [[ -n "$IMAGE_PACKAGE$IMAGE_ARTIFACT" || "$IMAGE_ARCHIVE_FILE" != "image.tar.gz" ]]
          then
            if [[ -z "$IMAGE_PACKAGE" || -z "$IMAGE_ARTIFACT" || -z "$IMAGE_ARCHIVE_FILE" ]]
            then
              echo "Image package, artifact name and archive filename must be provided together." >&2
              exit 1
            fi
            if [[ ! "$IMAGE_PACKAGE" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ || ! "$IMAGE_ARCHIVE_FILE" =~ ^[A-Za-z0-9_.-]+$ || "$IMAGE_ARCHIVE_FILE" == . || "$IMAGE_ARCHIVE_FILE" == .. ]]
            then
              echo "Image package or archive filename has an invalid format." >&2
              exit 1
            fi
          fi
          nix eval --json .#packages.aarch64-linux --apply builtins.attrNames \
            | jq -r --argjson exclude "$EXCLUDE" '.[] | select(. as $name | $exclude | index($name) | not)' \
            | while read -r attr
          do
            nix build --no-link --print-build-logs --print-out-paths ".#packages.aarch64-linux.$attr" \
              > "$RUNNER_TEMP/outs/$attr"
            # A crane package's dependency build and vendored sources are only
            # build inputs, so pushing the package leaves them out of the cache
            # and every source change rebuilds all dependencies. Push them too.
            for input in cargoArtifacts cargoVendorDir
            do
              if [[ "$(nix eval --json ".#packages.aarch64-linux.$attr" \
                --apply "p: p ? $input && builtins.isAttrs p.$input && p.$input ? outPath")" == true ]]
              then
                nix build --no-link --print-out-paths ".#packages.aarch64-linux.$attr.$input" \
                  > "$RUNNER_TEMP/outs/$attr-$input"
              fi
            done
          done
          if [[ -n "$IMAGE_PACKAGE" ]]
          then
            image_paths="$RUNNER_TEMP/outs/$IMAGE_PACKAGE"
            if [[ ! -s "$image_paths" ]]
            then
              echo "The configured image package was not built (it may be excluded)." >&2
              exit 1
            fi
            mapfile -t image_outputs < "$image_paths"
            if (( ${#image_outputs[@]} != 1 ))
            then
              echo "The configured image package must produce exactly one output path." >&2
              exit 1
            fi
            image_path="${image_outputs[0]}"
            if [[ -z "$image_path" || ! -f "$image_path" ]]
            then
              echo "The optional image package did not produce a regular archive file." >&2
              exit 1
            fi
            cp --dereference "$image_path" "$RUNNER_TEMP/$IMAGE_ARCHIVE_FILE"
          fi
      - name: Push to niks3
        # Not for forks (no OIDC token) or branches other than main and pull requests.
        if: ${{ env.NIKS3_SERVER_URL != '' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
        env:
          PIN_PREFIX: ${{ inputs.pin-prefix }}
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]
          then
            echo "No GitHub OIDC token available; not pushing." >&2
            exit 0
          fi
          cli="$(nix build --no-link --print-out-paths "$NIKS3_CLI")"
          auth=(--server-url "$NIKS3_SERVER_URL" --auth-token-script "python3 $GITHUB_WORKSPACE/.ci-workflows/scripts/niks3-oidc-token.py")
          for file in "$RUNNER_TEMP"/outs/*
          do
            attr="$(basename "$file")"
            index=0
            while read -r path
            do
              if [[ "$GITHUB_REF" == refs/heads/main ]]
              then
                "$cli/bin/niks3" push "${auth[@]}" --pin "$PIN_PREFIX-$attr-$index" "$path"
              else
                "$cli/bin/niks3" push "${auth[@]}" "$path"
              fi
              index=$((index + 1))
            done < "$file"
          done
      - name: Upload aarch64 image archive
        if: ${{ inputs.image-package != '' && inputs.image-artifact != '' && inputs.image-archive-file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/${{ inputs.image-archive-file }}
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  checks:
    name: checks
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pschmitt/ci-workflows
          path: .ci-workflows
      - uses: pschmitt/ci-workflows/.github/actions/nix-niks3@main
        with:
          s3-store: ${{ secrets.s3_store }}
          s3-access-key: ${{ secrets.s3_access_key }}
          s3-secret-key: ${{ secrets.s3_secret_key }}
          s3-public-keys: ${{ inputs.s3-public-keys }}
          extra-conf: |
            fallback = true
            auto-optimise-store = false
      - name: Show Nix trust settings
        run: |
          nix --version
          nix config show trusted-public-keys
          nix config show require-sigs
          sudo cat /etc/nix/nix.conf /etc/nix/nix.custom.conf 2>/dev/null | grep -E 'trusted-public-keys|include' || true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          gc-max-store-size-linux: 4G
      - name: Flake checks
        env:
          EXCLUDE_CHECKS: ${{ inputs.exclude-checks }}
        # Not `nix flake check`: upstream Nix evaluates every package and check
        # of this system there, so an `exclude`d package (one that cannot even
        # evaluate on aarch64-linux) or an `exclude-checks` entry fails it. The
        # packages are built above; build the remaining checks one by one.
        run: |
          mkdir -p "$RUNNER_TEMP/outs"
          nix eval --json .#checks.aarch64-linux --apply builtins.attrNames \
            | jq -r --argjson exclude "$EXCLUDE_CHECKS" '.[] | select(. as $name | $exclude | index($name) | not)' \
            | while read -r attr
          do
            nix build --no-link --print-build-logs --print-out-paths ".#checks.aarch64-linux.$attr" \
              > "$RUNNER_TEMP/outs/check-$attr"
          done
      - name: Push checks to niks3
        # Not for forks (no OIDC token) or branches other than main and pull requests.
        if: ${{ env.NIKS3_SERVER_URL != '' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') }}
        env:
          PIN_PREFIX: ${{ inputs.pin-prefix }}
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]
          then
            echo "No GitHub OIDC token available; not pushing." >&2
            exit 0
          fi
          cli="$(nix build --no-link --print-out-paths "$NIKS3_CLI")"
          auth=(--server-url "$NIKS3_SERVER_URL" --auth-token-script "python3 $GITHUB_WORKSPACE/.ci-workflows/scripts/niks3-oidc-token.py")
          shopt -s nullglob
          for file in "$RUNNER_TEMP"/outs/check-*
          do
            attr="${file##*/check-}"
            index=0
            while read -r path
            do
              if [[ "$GITHUB_REF" == refs/heads/main ]]
              then
                "$cli/bin/niks3" push "${auth[@]}" --pin "$PIN_PREFIX-check-$attr-$index" "$path"
              else
                "$cli/bin/niks3" push "${auth[@]}" "$path"
              fi
              index=$((index + 1))
            done < "$file"
          done
